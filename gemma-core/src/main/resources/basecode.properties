# Default ontology configuration, ported in-tree from baseCode 1.1.34-RENOVATIONS
# (src/basecode.properties) as part of the baseCode dependency retirement. The
# file name is preserved verbatim because the in-tree Configuration class and
# the BaseCodeConfigurer Spring post-processor both look up '/basecode.properties'
# on the classpath, and Gemma deployments may also rely on the 'basecode.'
# system-property prefix.

# set to true to enable specific ontologies
load.chebiOntology=false
load.cellTypeOntology=false
load.humanDevelOntology=false
load.mouseDevelOntology=false
load.mammalPhenotypeOntology=false
load.humanPhenotypeOntology=false
load.obiOntology=false
load.seqOntology=false
load.medicOntology=false
load.experimentalFactorOntology=false
load.uberonOntology=false
# Cellosaurus (cell lines) and MGI (mouse strains) lexical resolvers. Read via Configuration like the
# other ontology loaders, so enable with -Dload.<name>=true (bare) or -Dbasecode.load.<name>=true.
load.cellosaurus=false
load.mgiStrain=false
# MeSH entry terms as extra search strings for MONDO disease terms. No url.* key: the table is a
# precomputed classpath resource built by scripts/build_mesh_disease_synonyms.py.
load.meshDiseaseSynonyms=false
# Behavioural paradigms used as treatments/experimental conditions; nothing else loaded covers
# them (fear conditioning is NBO:0000209, and neither EFO nor any disease ontology has it).
# RGD's XCO was evaluated for this axis and rejected: much of it restates CHEBI compounds under
# XCO URIs, which would split one concept across two namespaces.
load.neuroBehaviorOntology=false
# Genotype Ontology (zygosity/alleles). Loaded because the corpus already uses it and could not
# resolve it: GENO:0000135 'Heterozygous' has usageCount 285 while /annotations/term 404'd on it.
load.genotypeOntology=false

# where possible, use URLs from http://www.obofoundry.org/
# CHEBI: full chebi.owl (825 MB). It is the ONLY published variant that carries
# synonyms — verified 2026-08-09 by counting hasExactSynonym assertions in each:
#
#   chebi_lite.owl  175 MB  labels + definitions, ZERO synonyms
#   chebi_core.owl  346 MB  labels + chemical data, ZERO synonyms
#   chebi.owl       825 MB  ~3 synonyms per term
#
# This file previously pointed at chebi_lite and claimed in this very comment that
# lite "keeps hasExactSynonym". It does not, and the claim is what stopped anyone
# from checking: every CHEBI term was reachable by its preferred label and by no
# other name, so `aspirin` found nothing while `acetylsalicylic acid` worked, and
# every drug abbreviation (FTC, TDF, GLP-1) missed entirely.
#
# The size is paid at slim-BUILD time, not at runtime: OntologySlimExtractor cuts
# this to a corpus-tailored slim (~10 MB) that carries the labels and synonyms
# forward, and that slim is what boots. See ChebiOntologyService#loadModel — note
# its fallback parses THIS file when the slim is missing or stale, which is now an
# 825 MB parse rather than a 175 MB one.
url.chebiOntology=http://purl.obolibrary.org/obo/chebi/chebi.owl
# Use upstream `-base` variants where available: same class set + same intra-
# ontology axioms (labels, synonyms, hierarchy, cross-ontology relationship
# axioms preserved), but the merged-in copies of imported ontologies are
# dropped. EFO went 329 MB -> 28.5 MB on this switch; CL, MP, HP, UBERON are
# all 1.6-5x smaller. Cross-ontology term lookups still resolve via each
# referenced ontology's own service (e.g. a CL URI referenced from UBERON
# resolves via CellTypeOntologyService, not via the duplicate copy that
# used to be merged into uberon.owl).
url.cellTypeOntology=http://purl.obolibrary.org/obo/cl/cl-base.owl
url.mouseDevelOntology=http://purl.obolibrary.org/obo/emapa.owl
url.humanDevelOntology=http://purl.obolibrary.org/obo/ehdaa2.owl
url.mammalPhenotypeOntology=http://purl.obolibrary.org/obo/mp/mp-base.owl
url.humanPhenotypeOntology=http://purl.obolibrary.org/obo/hp/hp-base.owl
url.seqOntology=http://purl.obolibrary.org/obo/so.owl
url.unitsOntology=http://purl.obolibrary.org/obo/uo.owl
# according to http://www.obofoundry.org/ontology/clo.html this "should" point to https://raw.githubusercontent.com/CLO-ontology/CLO/master/src/ontology/clo_merged.owl
url.cellLineOntology=http://purl.obolibrary.org/obo/clo.owl
url.cellosaurus=https://ftp.expasy.org/databases/cellosaurus/cellosaurus.obo
url.mgiStrain=https://www.informatics.jax.org/downloads/reports/MGI_Strain.rpt
# MGI's genotype-to-disease reports. NOT ontologies -- these are relation sources read by
# MgiRelationProducer, so there is no matching load.* flag; the relation CLI fetches them on demand.
# The second file is the NEGATIVE set: genotypes MGI's curators say do NOT model a disease.
url.mgiGenoDisease=https://www.informatics.jax.org/downloads/reports/MGI_Geno_DiseaseDO.rpt
url.mgiGenoNotDisease=https://www.informatics.jax.org/downloads/reports/MGI_Geno_NotDiseaseDO.rpt
# Uberon -base drops the bundled MA / FMA / ZFA imports we don't query.
url.uberonOntology=http://purl.obolibrary.org/obo/uberon/uberon-base.owl

# EFO -base: 28.5 MB vs 329 MB for the merged file. The merged file's bulk
# is duplicated MONDO + UBERON + OBI + OGMS imports; we load each of those
# separately so the merged copy is pure waste.
url.efOntology=https://www.ebi.ac.uk/efo/efo-base.owl
url.obiOntology=http://purl.obolibrary.org/obo/obi.owl
url.neuroBehaviorOntology=http://purl.obolibrary.org/obo/nbo.owl
url.genotypeOntology=http://purl.obolibrary.org/obo/geno.owl

ontology.index.dir=
ontology.cache.dir=
# Pin the on-disk ontology cache: a startup load reads the cached bytes and never contacts the
# remote. NOT a performance switch -- the conditional-GET path already skips re-downloading an
# unchanged source. It is a reproducibility switch: when an ontology publishes a new release, an
# ordinary restart otherwise swaps the vocabulary underneath a corpus annotated against the old
# one. Observed on frink 2026-08-15 -- CHEBI's cached validator stopped matching upstream and a
# routine restart began pulling 866 MB at ~174 KB/s, 73 minutes of boot for a CHEBI nobody asked
# for. Updating stays available and becomes deliberate: POST /admin/ontologies/{name}/refresh
# passes forceLoad=true, which bypasses the pin. With no cached copy present the source is
# fetched once to seed the cache, with a warning.
ontology.cache.pinned=false
ncbo.api.key=

rserve.start.command=
rlibpath=
