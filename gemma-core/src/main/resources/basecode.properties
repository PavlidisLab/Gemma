# Default ontology configuration, ported in-tree from baseCode 1.1.34-RENOVATIONS
# (src/basecode.properties) as part of the baseCode dependency retirement. The
# file name is preserved verbatim because the in-tree Configuration class and
# the BaseCodeConfigurer Spring post-processor both look up '/basecode.properties'
# on the classpath, and Gemma deployments may also rely on the 'basecode.'
# system-property prefix.

# set to true to enable specific ontologies
load.chebiOntology=false
load.cellTypeOntology=false
load.humanDevelOntology=false
load.mouseDevelOntology=false
load.mammalPhenotypeOntology=false
load.humanPhenotypeOntology=false
load.obiOntology=false
load.seqOntology=false
load.medicOntology=false
load.experimentalFactorOntology=false
load.uberonOntology=false

# where possible, use URLs from http://www.obofoundry.org/
# CHEBI: use upstream chebi_lite (172 MB, ~5x smaller than full chebi.owl). Drops
# chemical-structure axioms we never query (SMILES, InChI, formula, mass, xrefs);
# keeps rdfs:label, hasExactSynonym, IAO definitions, subClassOf hierarchy, and
# RO:0000087 has_role axioms — i.e. exactly the shape OntologySlimExtractor was
# built to produce. Maintained by the CHEBI team so upstream releases stay current
# without our extractor in the loop.
url.chebiOntology=http://purl.obolibrary.org/obo/chebi/chebi_lite.owl
# Use upstream `-base` variants where available: same class set + same intra-
# ontology axioms (labels, synonyms, hierarchy, cross-ontology relationship
# axioms preserved), but the merged-in copies of imported ontologies are
# dropped. EFO went 329 MB -> 28.5 MB on this switch; CL, MP, HP, UBERON are
# all 1.6-5x smaller. Cross-ontology term lookups still resolve via each
# referenced ontology's own service (e.g. a CL URI referenced from UBERON
# resolves via CellTypeOntologyService, not via the duplicate copy that
# used to be merged into uberon.owl).
url.cellTypeOntology=http://purl.obolibrary.org/obo/cl/cl-base.owl
url.mouseDevelOntology=http://purl.obolibrary.org/obo/emapa.owl
url.humanDevelOntology=http://purl.obolibrary.org/obo/ehdaa2.owl
url.mammalPhenotypeOntology=http://purl.obolibrary.org/obo/mp/mp-base.owl
url.humanPhenotypeOntology=http://purl.obolibrary.org/obo/hp/hp-base.owl
url.seqOntology=http://purl.obolibrary.org/obo/so.owl
url.unitsOntology=http://purl.obolibrary.org/obo/uo.owl
# according to http://www.obofoundry.org/ontology/clo.html this "should" point to https://raw.githubusercontent.com/CLO-ontology/CLO/master/src/ontology/clo_merged.owl
url.cellLineOntology=http://purl.obolibrary.org/obo/clo.owl
# Uberon -base drops the bundled MA / FMA / ZFA imports we don't query.
url.uberonOntology=http://purl.obolibrary.org/obo/uberon/uberon-base.owl

# EFO -base: 28.5 MB vs 329 MB for the merged file. The merged file's bulk
# is duplicated MONDO + UBERON + OBI + OGMS imports; we load each of those
# separately so the merged copy is pure waste.
url.efOntology=https://www.ebi.ac.uk/efo/efo-base.owl
url.obiOntology=http://purl.obolibrary.org/obo/obi.owl

ontology.index.dir=
ontology.cache.dir=
ncbo.api.key=

rserve.start.command=
rlibpath=
