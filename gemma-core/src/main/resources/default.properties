# Database configuration
gemma.db.host=localhost
gemma.db.port=3306
gemma.db.name=gemd
# JDBC URL query string; set to "useSSL=true&requireSSL=true" for TLS-required prod deployments
gemma.db.urlQuery=useSSL=false
gemma.db.url=jdbc:mysql://${gemma.db.host}:${gemma.db.port}/${gemma.db.name}?${gemma.db.urlQuery}
# You must override these settings:
gemma.db.user=gemmauser
gemma.db.password=XXXXXX
# Maximum size for the connections pool
gemma.db.maximumPoolSize=10
gemma.db.minimumIdle=${gemma.db.maximumPoolSize}
# MySQL Connector/J + session tuning passed through HikariConfig.dataSourceProperties.
# Override per-environment (e.g. tests may want a different sql_mode) without a Java rebuild.
# sql_mode here deliberately omits ONLY_FULL_GROUP_BY because Gemma's HQL produces aggregates
# without listing every non-aggregate column in GROUP BY, a pattern strict mode forbids.
gemma.db.hikari.useCursorFetch=true
gemma.db.hikari.rewriteBatchedStatements=true
gemma.db.hikari.connectionTimeZone=America/Vancouver
gemma.db.hikari.sessionVariables=sql_mode='STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION'
# Pool-level Hikari knobs (HikariDataSource setters, NOT driver-level dataSourceProperties).
# These are sensible defaults for dev / local; production env.example overrides them.
# Unset = fall through to Hikari's own built-in defaults.
#   keepaliveTime=60000   — ping idle connections every 60s so a tunnel- or server-dropped
#                           socket is reaped before the next acquire (Hikari default: disabled).
#   maxLifetime=1800000   — recycle each connection after 30min. MUST be < MySQL wait_timeout.
#   connectionTimeout=10000 — fail an acquire after 10s instead of the Hikari default 30s; a
#                             dead tunnel surfaces fast.
# idleTimeout is left unset — Hikari's 10min default is fine for dev.
gemma.db.hikari.keepaliveTime=60000
gemma.db.hikari.maxLifetime=1800000
gemma.db.hikari.connectionTimeout=10000
############################################################
