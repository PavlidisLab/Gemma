# suppress inspection "UnusedProperty" for whole file
# This properties file is used to configure default settings.
# Local installations can override these settings with a Gemma.properties file. 
# See also project.properties for additional settings.
#####################################################
# PATHS
# Some tools will write results or reports here.
# Allow sufficient space, especially if search indices are stored here (see below)
# Default resolves via java.io.tmpdir so this works on Linux, macOS, Windows, and containers without override.
# Production installs should ALWAYS override this with a stable path (e.g. /srv/gemmaData) -- the JVM temp dir is
# fine for development but not for anything you care about keeping.
gemma.appdata.home=${java.io.tmpdir}/gemmaData
# Location where files downloaded by Gemma will end up.
gemma.download.path=${gemma.appdata.home}/download
# Where some outputs will be stored on disk.
gemma.analysis.dir=${gemma.appdata.home}/analysis
# For search engines: where the indexes are stored.
# Renovations Phase 3: this directory is the root for Hibernate Search 7's Lucene
# indexes (one sub-directory per @Indexed entity). It is consumed by HibernateConfig
# and emitted as the hibernate.search.backend.directory.root property at SessionFactory
# build time. Override per-host via Gemma.properties for production deployments.
gemma.search.dir=${gemma.appdata.home}/searchIndices
# Lucene-hit over-fetch multiplier for HibernateSearchSource. Applied only when the
# current authentication is a non-admin authenticated user; the ACL post-filter then
# trims results back to maxResults. Anonymous and admin paths fetch exactly maxResults.
# See PERF_PROBE_SEARCH Top Finding #4. Hard cap is 500 (see HibernateSearchSource).
gemma.search.acl.over_fetch_multiplier=2
# For backward-compatibility with existing configuration, please replace with ${gemma.search.dir}
gemma.compass.dir=${gemma.search.dir}
# Cron expression for the nightly MassIndexer pass (ScheduledSearchReindexer).
# Spring 6-field format: sec min hour day-of-month month day-of-week. Default: 3 AM daily.
# Only fires when the "scheduler" profile is active (production maintenance node).
# See PERF_PROBE_SEARCH.md Top Finding #2 for context.
gemma.search.reindex.cron=0 0 3 * * *
# Ceiling (ms) on the ontology search + inference leg of an experiment search. Because the search
# runs in a read-only transaction, this also bounds how long one request holds its pooled DB
# connection during that leg — keep it at or below the Hikari connectionTimeout (gemma.db.hikari.
# connectionTimeout) so a slow ontology walk can't pin a connection long enough to starve the pool.
gemma.search.ontology.timeoutMs=10000
# Widening a search into inferred relations (SearchSettings.useInferredRelations, off unless the
# caller opts in). How many related terms ONE matched term may contribute: some genes carry a great
# many diseases -- Trp53 pairs with 15 in our corpus -- and expanding through all of them turns a
# search for one disease into a search for every dataset that ever mutated the gene. A cap on the
# ranked list rather than a specificity threshold, because a threshold is an absolute number nobody
# has tuned against curator judgement yet.
gemma.search.inferredRelations.maxTermsPerSeed=5
# Minimum specificity a CORPUS-attested relation must clear to widen a search; ignored for asserted
# bases, which are not counted. Zero means no filtering, which is the honest default until the
# distribution has been looked at -- the per-seed cap above is what bounds the widening today.
gemma.search.inferredRelations.minSpecificity=0
# Widen only through objects relating to at most this many distinct subjects. This one has a real
# default because the distribution was measured and is not close: Homozygous negative relates to
# 2,898 subjects, Overexpression 1,839, `24 h` 448 -- while MPTP and 5xFAD are in the low single
# digits. Widening through a dose or a zygosity reaches most of the corpus and presents it as an
# answer. Also catches generic ontology classes for free: `induced pluripotent stem cell line cell`
# relates to 81.
gemma.search.inferredRelations.maxObjectBreadth=25
# The expected structure in this root directory is then: ${gemma.fastq.headers.dir}/GSExxx/GSMxxx/SRRxxx.fastq.header
gemma.fastq.headers.dir=${gemma.appdata.home}/fastqHeaders
# Directory for on-disk cache, overwritten by the ehcache.disk.store.dir system property
gemma.cache.dir=${gemma.appdata.home}/cache
gemma.gene2cs.path=${gemma.appdata.home}/DBReports/gene2cs.info
# Directory for storing large temporary files, /var/tmp is usually inadequate, so it is recommended to override this
gemma.scratch.dir=${gemma.appdata.home}/scratch
# Directory where the source code of Gemma is located, This is a development feature only.
gemma.project.dir=.
# The value of this variable is usually overridden by the gemma.log.dir system property
gemma.log.dir=.
#####################################################
