gemma.upstream.annotationSearch.username=
gemma.upstream.annotationSearch.password=
gemma.upstream.annotationSearch.timeoutMs=25000

# Preferred URI-prefix lists per annotation category. Used by
# /annotations/categories to inform curation-ui (and proposer agents)
# which ontology namespaces to favour when the curator narrows a search
# to a single category. List order is preference order — earlier entries
# rank higher when ties tie. Same prefix tokens that /annotations/search
# accepts in its ?prefixes= param. Empty value (or an absent category)
# leaves the client free to use any ontology.
#
# Format: semicolon-separated category:prefix-list pairs. Keys here and
# the ?category= a caller sends are both folded to lowercase with
# separators dropped, so "cell type", "cellType" and "cell_type" are one
# category and the spelling below is only a readability choice. EFO
# appears at the end of each list as a fallback when no more-specific
# namespace covers a term.
#
# On the disease family (disease, diseaseModel, diseaseStaging) MONDO_ deliberately precedes
# the phenotype vocabularies HP_ and MP_, which are absent from those lists and therefore rank
# last. A disease and a phenotypic abnormality named by the same string are different
# assertions, and on a category called "disease model" the disease is what is meant:
# `Alzheimer disease` was returning HP_0002511 ahead of MONDO_0004975. diseaseModel and
# diseaseStaging previously had NO entry at all -- an absent category gets no promotion
# whatsoever, and they do not inherit one from `disease`, which is why the two behaved
# differently from it. MP_ is listed nowhere for the same reason as HP_: it is the identical
# confusion on the mouse side.
#
# assay / biologicalSex / strain / studyDesign / diet / biologicalProcess were added from the
# polished 500 gold (1,018 tags), where each is what gold actually uses: OBI 300/300, PATO 87/87,
# EFO 31 + TGEMO 5, TGEMO 70 + OBI 1, EFO 2, GO 1/1. Eighteen categories previously declared no
# preference at all, and an absent category gets no promotion whatsoever. Derived from gold rather
# than asserted -- a hand-written version of this table flagged 26 gold tags as violations and 20
# of those were the table being wrong.
#
# NBO_ joins treatment because gold grounds `fear conditioning` to NBO:0000209 and nothing else
# loaded carries it. OBI is deliberately NOT added to treatment despite gold's single OBI
# treatment: one row is not evidence.
#
# DOID_ and NCIT_ were dropped from the disease rows 2026-08-15 for the same reason GENO_ was
# caught: Gemma loads neither, so both 404 on /annotations/term. Unlike GENO they are also absent
# from the corpus -- searches for `cancer`, `asthma` and `stage ii` return zero DOID or NCIT hits
# against 44 MONDO ones -- so these were aspirational tokens that had never promoted anything, and
# removing them cannot change any ranking. If either is ever wanted, load the ontology first and
# add the row back in the same commit.
#
# GENO_ names the Genotype Ontology, which Gemma did NOT load until 2026-08-15 -- so every GENO
# term 404'd on /annotations/term and this row was promoting a namespace the curator UI could
# neither render nor commit, the same defect as ranking a null-URI row one layer up. CAB found it
# by wiring the published table into their filter, where a test pinning it to Gemma's loaded set
# rejected GENO. The fix was to load the ontology rather than drop the row: the corpus already
# had 285 experiments tagged GENO:0000135 'Heterozygous', so the annotations existed and only
# the resolver was missing. Keep this row and load.genotypeOntology in step with each other.
#
# 🛑 `ncbi_gene/` on genotype is NOT prefix-shaped, and that is fine: matching is
# `uri.contains(token)`, not startsWith -- which is also why `treatment:MGI:` works against
# `.../strain/MGI:3028467`. Gold's genotype values are ncbi_gene records 15 of 17
# (http://purl.org/commons/record/ncbi_gene/22059 = `Trp53 [mouse]`), so without this the
# preference described only the minority and the majority case ranked below it. It leads the list
# because it IS the common case for this category.
annotation.category.prefixes=cellType:CL_,CLO_,CVCL_,EFO_;cellLine:CLO_,EFO_,CVCL_;disease:MONDO_,EFO_;diseaseModel:MONDO_,EFO_;diseaseStaging:MONDO_,EFO_;organismPart:UBERON_,EMAPA_,EFO_;treatment:CHEBI_,EFO_,NBO_;phenotype:HP_,MP_,PATO_,EFO_;developmentalStage:UBERON_,EFO_;genotype:ncbi_gene/,TGEMO_,GENO_,PATO_,EFO_;biologicalProcess:GO_;assay:OBI_;biologicalSex:PATO_;strain:EFO_,TGEMO_;studyDesign:TGEMO_,OBI_;diet:EFO_
# Namespaces that are IMPOSSIBLE for a category, as opposed to merely unpreferred.
# Same key:prefix,... format as annotation.category.prefixes, but a deny list: matching
# hits leave `data` and are reported under `negativeEvidence.ruledOut` with
# reason=out_of_category, so an over-firing rule is visible rather than silent.
#
# Deliberately NOT the inverse of the preference table. Measured on the agents' 500-experiment
# run: 16% of committed answers (100 of 634) sit outside their category's preferred namespaces
# and are overwhelmingly CORRECT -- a treatment legitimately is an organism, a role, a procedure
# or an injury. Only add a pair when it is categorically impossible AND measured.
#
# genotype:MONDO_ : 10 cases answered a gene symbol with the disease it causes (RB1 ->
# retinoblastoma, TSC2, Mcph1), and no correct genotype answer is a MONDO term.
#
# treatment:MGI: : the MGI lexical catalogue supplies mouse gene and strain NAMES. A gene or a
# strain is a thing an experiment is done TO, never a thing done to it, so no correct treatment
# answer is an MGI row -- this is a statement about the namespace, not about any one query.
# Measured on gemma2 2026-08-13: `FTC` under category=treatment returns the MGI row `ftc` at
# Lucene rank 0, ahead of every ontology hit, because it is an exact preferred-label match and
# the relevance tiers see only label exactness. gemma-core already ranks these catalogues below
# every conventional-ontology hit (OntologyServiceImpl, `isSupplementary`), and the REST
# relevance tiering does not carry that distinction through -- the exclusion is the general fix
# available in config today; teaching the tiers about supplementary sources is the wider one.
# Note the value itself contains a colon; only the FIRST colon separates key from prefix list.
#
# *:GO_ : `*` denies a namespace for EVERY category; a category opts back out by naming the
# prefix in annotation.category.prefixes (biologicalProcess does, below). GO is the one namespace
# that earns a blanket denial: a GO term is a process, a function or a component, so under any
# category naming a thing an experiment is done to or with, it is the wrong KIND of answer by
# construction -- `oxygen-glucose deprivation` returns GO:0090649 "response to oxygen-glucose
# deprivation", which is the response, not the intervention. Molecular function never makes sense
# anywhere; biological process as a factor value would mean the function itself is being
# manipulated, which is vanishingly rare. Measured in the polished 500 gold: GO appears in 1 of
# 1,018 tags, under `biological process` -- so the denial costs ~nothing and removes a whole class
# of confident wrong-kind answers. Wildcard rather than 20 hand-listed categories because that
# form fails open the day a category is added.
# 🛑 KNOWN COST: an organism part legitimately CAN be a cellular component, and this denies that
# too, because all three GO sub-ontologies share the GO_ prefix and a prefix rule cannot tell them
# apart. Splitting them needs GeneOntologyService.getTermAspect (which exists, and is cached) wired
# into the filter. Not done: the cases show up in ruledOut with reason=out_of_category, so if it
# bites it is visible, and the fix is to add GO_ to organismPart's preference list.
#
# Remove any entry to disable it.
annotation.category.excludedPrefixes=genotype:MONDO_;treatment:MGI:;*:GO_
