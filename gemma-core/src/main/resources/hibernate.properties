# This is needed by schema-export.
# Hibernate 6 collapsed the per-version MySQL dialect classes into a single
# parameterised MySQLDialect; the lab's shim (MySQL57InnoDBDialect) extends
# MySQLDialect and pins to DatabaseVersion 5.7. The runtime dialect is set in
# applicationContext-hibernate.xml; this property only takes effect for tools
# that load hibernate.properties directly.
hibernate.dialect=ubic.gemma.persistence.hibernate.MySQL57InnoDBDialect